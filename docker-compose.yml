version: "3.9"

services:
  next-app:
    container_name: solfa-mvp
    build: 
      context: .
      target: deps 
    ports:
      - "3000:3000"
    volumes:
      - .:/app              
      - /app/node_modules  
      - /app/.next         
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true 
    command: npm run dev   